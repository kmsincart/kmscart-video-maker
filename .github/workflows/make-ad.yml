name: KMS CART Video Ad Maker

on:
  workflow_dispatch:
    inputs:
      image_url: { required: true }
      title: { required: true }
      caption: { required: false }
      webhook_url: { required: false }
  repository_dispatch:
    types: [make_ad_video]

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install Open-Source Video, Studio Music & Font Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji fluidsynth fluid-soundfont-gm
          pip install -q edge-tts midiutil

      - name: Set Variables
        run: |
          echo "IMG=${{ github.event.inputs.image_url || github.event.client_payload.image_url }}" >> $GITHUB_ENV
          RAW_T="${{ github.event.inputs.title || github.event.client_payload.title }}"
          echo "TITLE=$(echo "${RAW_T:0:45}" | tr -d "'\"")" >> $GITHUB_ENV
          echo "CAPTION=${{ github.event.inputs.caption || github.event.client_payload.caption }}" >> $GITHUB_ENV
          echo "HOOK=${{ github.event.inputs.webhook_url || github.event.client_payload.webhook_url }}" >> $GITHUB_ENV

      - name: Build Real-Life Pixabay B-Roll, Natural Hindi/English Voice & Video
        env:
          TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PIX_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          curl -L -s "$IMG" -o product.jpg
          cat << 'EOF' > build.py
          import os, re, html, json, base64, asyncio, subprocess, urllib.request, urllib.parse, edge_tts
          from midiutil import MIDIFile

          title = os.environ.get("TITLE", "Smart Deal").strip()
          caption = os.environ.get("CAPTION", "").strip()
          tts_key = os.environ.get("TTS_KEY", "").strip()
          pix_key = os.environ.get("PIX_KEY", "").strip()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          tl = title.lower()

          q = "modern home lifestyle"
          if any(w in tl for w in ["car","bike","tyre","windshield","vacuum"]): q = "car driving clean"
          elif any(w in tl for w in ["kitchen","jug","tumbler","chopper","bottle","mug","cleaner","dish"]): q = "modern kitchen cooking"
          elif any(w in tl for w in ["baby","kid","toy","toothbrush","puzzle"]): q = "happy family kids home"
          elif any(w in tl for w in ["pet","dog","cat"]): q = "cute dog cat home"
          elif any(w in tl for w in ["makeup","lipstick","cosmetic","shoe"]): q = "fashion lifestyle beauty"

          if pix_key:
              try:
                  url = f"https://pixabay.com/api/videos/?key={pix_key}&q={urllib.parse.quote(q)}&per_page=10&safesearch=true"
                  data = json.loads(urllib.request.urlopen(url, timeout=15).read().decode())
                  hits = data.get("hits", [])
                  if hits:
                      v_info = hits[run_num % len(hits)].get("videos", {})
                      v_url = (v_info.get("medium") or v_info.get("small") or {}).get("url")
                      if v_url: urllib.request.urlretrieve(v_url, "bg_video.mp4")
              except Exception as e: print("Pixabay fallback:", e)

          clean = re.sub(r'[*#_`]', '', caption)
          parts = [re.sub(r'^(Malayalam|Hindi|English)\s*[:\-–]\s*', '', l.strip(), flags=re.I) for l in re.split(r'[\n.!?]+', clean)]
          hi_lines = [l for l in parts if len(l) > 6 and re.search(r'[\u0900-\u097F]', l)]
          en_lines = [l for l in parts if len(l) > 6 and re.search(r'[A-Za-z]', l) and not re.search(r'[\u0D00-\u0D7F\u0900-\u097F]', l)]
          hi_sub = hi_lines[0][:85] if hi_lines else "भारत में ट्रेंडिंग स्मार्ट डील — अभी ऑर्डर करें!"

          use_hi = (run_num % 2 == 0)
          if use_hi:
              spoken = f"{hi_sub}. अभी ऑर्डर करें kmscart dot com पर! कैश ऑन डिलीवरी और फ्री डिलीवरी उपलब्ध है."
              gvoice, evoice, lang = "hi-IN-Wavenet-A", "hi-IN-SwaraNeural", "hi-IN"
          else:
              en_hook = en_lines[0][:100] if en_lines else f"Upgrade your home with {title}"
              spoken = f"{en_hook}. Order now at kmscart dot com! Free Pan-India delivery and Cash on Delivery available."
              gvoice, evoice, lang = "en-IN-Wavenet-D", "en-IN-NeerjaExpressiveNeural", "en-IN"

          tts_ok = False
          if tts_key:
              try:
                  req = urllib.request.Request(
                      f"https://texttospeech.googleapis.com/v1/text:synthesize?key={tts_key}",
                      data=json.dumps({"input":{"text":spoken},"voice":{"languageCode":lang,"name":gvoice},"audioConfig":{"audioEncoding":"MP3","speakingRate":1.02}}).encode(),
                      headers={"Content-Type":"application/json"}
                  )
                  res = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
                  if "audioContent" in res:
                      open("voice.mp3","wb").write(base64.b64decode(res["audioContent"]))
                      tts_ok = True
              except Exception as e: print("Google TTS fallback:", e)
          if not tts_ok:
              try: asyncio.run(edge_tts.Communicate(spoken, evoice, rate="+4%").save("voice.mp3"))
              except Exception as e: print("Edge TTS:", e)

          dur = 12.0
          if os.path.exists("voice.mp3"):
              out = subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1","voice.mp3"]).decode().strip()
              dur = max(10.0, min(18.0, float(out) + 1.2))

          midi = MIDIFile(2)
          midi.addTempo(0, 0, 100); midi.addProgramChange(0, 0, 0, 12)
          midi.addTempo(1, 0, 100); midi.addProgramChange(1, 1, 0, 89)
          chords = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]]
          for bar in range(10):
              c = chords[bar % 4]
              for n in c: midi.addNote(1, 1, n, bar*4, 4, 55)
              for step, n in enumerate(c * 2): midi.addNote(0, 0, n+12, bar*4 + step*0.5, 0.45, 85)
          with open("bgm.mid", "wb") as f: midi.writeFile(f)

          words = hi_sub.split()
          per_w = max(25, int(((dur - 1.5) * 100) / max(1, len(words))))
          k_line = "".join(f"{{\\k{per_w}}}{w} " for w in words)
          ass = f"""[Script Info]
          PlayResX: 1080
          PlayResY: 1920
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans Devanagari,52,&H0000E5FF,&H00FFFFFF,&H00000000,&HB0000000,-1,0,0,0,100,100,0,0,3,4,0,2,60,60,420,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.20,0:00:{dur-0.3:05.2f},Default,,0,0,0,,{k_line}
          """
          open("subs.ass", "w", encoding="utf-8").write(ass)

          themes = [("#0f172a","#1e293b","#f59e0b","#111827","🔥 TRENDING IN INDIA"),("#991b1b","#dc2626","#fde047","#111827","⚡ SMART DEAL TODAY"),("#111827","#1f2937","#38bdf8","#082f49","✨ BESTSELLER PICK")]
          b1,b2,ac,at,tg = themes[run_num % 3]
          open("overlay.html","w",encoding="utf-8").write(f"""<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{{box-sizing:border-box;margin:0;padding:0}}body{{width:1080px;height:1920px;background:transparent;font-family:'Noto Sans','Noto Color Emoji',sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:56px 48px}}.top{{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,.82);padding:20px 34px;border-radius:28px;border:2px solid rgba(255,255,255,.18)}}.logo{{color:#fff;font-size:34px;font-weight:900;letter-spacing:2px}}.tag{{background:{ac};color:{at};font-size:26px;font-weight:900;padding:10px 26px;border-radius:999px}}.card{{width:100%;background:linear-gradient(135deg,{b1},{b2});color:#fff;padding:34px 36px;border-radius:32px;text-align:center;border:2px solid rgba(255,255,255,.22);display:flex;flex-direction:column;gap:18px;align-items:center}}.ti{{font-size:38px;font-weight:800;color:#fff}}.bs{{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}}.bg{{background:rgba(255,255,255,.14);padding:10px 22px;border-radius:14px;font-size:26px;font-weight:700}}.ct{{background:{ac};color:{at};font-size:34px;font-weight:900;padding:16px 44px;border-radius:999px}}</style></head><body><div class="top"><div class="logo">KMS CART</div><div class="tag">{tg}</div></div><div class="card"><div class="ti">{html.escape(title)}</div><div class="bs"><div class="bg">💵 Cash on Delivery</div><div class="bg">🚚 Free Pan-India Delivery</div></div><div class="ct">🛒 Order Now: www.kmscart.com</div></div></body></html>""")
          open("dur.txt","w").write(f"{dur:.1f}")
          EOF
          python3 build.py
          VDUR=$(cat dur.txt)
          SF2=$(find /usr/share/sounds/sf2 -name "*.sf2" | head -n 1)
          fluidsynth -ni "$SF2" bgm.mid -F bgm.wav -r 44100 >/dev/null 2>&1
          google-chrome --headless --no-sandbox --disable-gpu --screenshot=overlay.png --window-size=1080,1920 --default-background-color=00000000 overlay.html
          if [ -f bg_video.mp4 ]; then
            ffmpeg -y -stream_loop -1 -i bg_video.mp4 -loop 1 -i product.jpg -i overlay.png -i voice.mp3 -i bgm.wav -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=brightness=-0.12[bg];[1:v]scale=640:640:force_original_aspect_ratio=decrease:flags=lanczos,pad=680:680:(ow-iw)/2:(oh-ih)/2:color=white,zoompan=z='min(zoom+0.0012,1.12)':d=540:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=680x680:fps=30[fg];[bg][fg]overlay=(W-w)/2:250[base];[base][2:v]overlay=0:0,ass=subs.ass[v];[3:a]apad,loudnorm=I=-16:TP=-1.5:LRA=11,asplit=2[vo1][vo2];[4:a]volume=0.22[mu];[mu][vo1]sidechaincompress=threshold=0.02:ratio=6:attack=20:release=250[duck];[vo2][duck]amix=inputs=2:duration=first[a]" -map "[v]" -map "[a]" -t "$VDUR" -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k ad_video.mp4
          else
            ffmpeg -y -loop 1 -i product.jpg -i overlay.png -i voice.mp3 -i bgm.wav -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=35:6,eq=brightness=-0.25[bg];[0:v]scale=880:880:force_original_aspect_ratio=decrease:flags=lanczos,pad=920:920:(ow-iw)/2:(oh-ih)/2:color=white,zoompan=z='min(zoom+0.0012,1.14)':d=540:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=920x920:fps=30[fg];[bg][fg]overlay=(W-w)/2:240[base];[base][1:v]overlay=0:0,ass=subs.ass[v];[2:a]apad,loudnorm=I=-16:TP=-1.5:LRA=11,asplit=2[vo1][vo2];[3:a]volume=0.22[mu];[mu][vo1]sidechaincompress=threshold=0.02:ratio=6:attack=20:release=250[duck];[vo2][duck]amix=inputs=2:duration=first[a]" -map "[v]" -map "[a]" -t "$VDUR" -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k ad_video.mp4
          fi

      - name: Upload Video to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ad-${{ github.run_id }}
          files: ad_video.mp4

      - name: Notify Make.com Webhook
        if: env.HOOK != ''
        run: |
          VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/ad-${{ github.run_id }}/ad_video.mp4"
          jq -n --arg v "$VIDEO_URL" --arg t "$TITLE" --arg c "$CAPTION" '{video_url:$v, title:$t, caption:$c}' > payload.json
          curl -s -X POST -H "Content-Type: application/json" -d @payload.json "$HOOK"
