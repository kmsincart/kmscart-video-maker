name: KMS CART Video Ad Maker

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Product Image URL'
        required: true
      title:
        description: 'Product Title'
        required: true
      caption:
        description: 'Ad Caption'
        required: false
      webhook_url:
        description: 'Make.com Webhook URL'
        required: false
  repository_dispatch:
    types: [make_ad_video]

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install Open-Source Video, Audio & Font Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
          pip install -q edge-tts

      - name: Set variables
        run: |
          IMG="${{ github.event.inputs.image_url || github.event.client_payload.image_url }}"
          RAW_TITLE="${{ github.event.inputs.title || github.event.client_payload.title }}"
          SAFE_TITLE=$(echo "${RAW_TITLE:0:45}" | tr -d "'\"")
          CAPTION="${{ github.event.inputs.caption || github.event.client_payload.caption }}"
          HOOK="${{ github.event.inputs.webhook_url || github.event.client_payload.webhook_url }}"
          echo "IMG=$IMG" >> $GITHUB_ENV
          echo "TITLE=$SAFE_TITLE" >> $GITHUB_ENV
          echo "CAPTION=$CAPTION" >> $GITHUB_ENV
          echo "HOOK=$HOOK" >> $GITHUB_ENV

      - name: Generate AI Voiceover, Background Music & Styled Overlay
        run: |
          curl -L -s "$IMG" -o product.jpg
          cat << 'EOF' > build_assets.py
          import os, re, html, asyncio, wave, math, struct
          import edge_tts

          title = os.environ.get("TITLE", "Smart Deal").strip()
          caption = os.environ.get("CAPTION", "").strip()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))

          clean_cap = re.sub(r'[*#_`]', '', caption)
          lines = [l.strip() for l in re.split(r'[.!?\n]+', clean_cap) if len(l.strip()) > 6]
          hook_text = lines[0][:85] if lines else "Trending Smart Find for Your Home!"

          has_ml = bool(re.search(r'[\u0D00-\u0D7F]', hook_text))
          has_hi = bool(re.search(r'[\u0900-\u097F]', hook_text))

          if has_ml:
              voice = "ml-IN-SobhanaNeural"
              spoken = f"{hook_text}. ഇപ്പോൾ തന്നെ ഓർഡർ ചെയ്യൂ. ക്യാഷ് ഓൺ ഡെലിവറിയും ഫ്രീ ഡെലിവറിയും ലഭ്യമാണ്. kmscart dot com."
          elif has_hi:
              voice = "hi-IN-SwaraNeural"
              spoken = f"{hook_text}. {title}. अभी ऑर्डर करें, कैश ऑन डिलीवरी और फ्री डिलीवरी उपलब्ध है. kmscart dot com."
          else:
              voice = "en-IN-NeerjaExpressiveNeural"
              spoken = f"{hook_text}. {title}. Cash on delivery and free Pan-India delivery available at kmscart dot com!"

          async def make_tts():
              communicate = edge_tts.Communicate(spoken, voice, rate="+5%")
